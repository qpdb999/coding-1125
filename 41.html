
<!--
HTML 시맨틱 태그(Semantic Tags)

    오늘 배운 내용

이번에는 HTML에서 웹 페이지의 영역을 의미에 맞게
구분할 수 있도록 도와주는 시맨틱 태그에 대해 배웠다.

시맨틱 태그는 각 영역이 어떤 역할을 하는지
태그 이름만으로도 쉽게 파악할 수 있도록 만들어진 태그이다.

대표적으로 header, nav, main, section, article, aside,
footer 등이 있으며, 웹 페이지의 구조를 더 명확하게 만들 수 있다.


    정의

시맨틱 태그(Semantic Tag)란 태그 자체에 의미가 담겨 있어
웹 페이지의 각 영역과 콘텐츠의 역할을 명확하게 나타내는 HTML 태그이다.

주요 시맨틱 태그

1) <header>
웹 페이지나 특정 영역의 머리말을 나타낸다.
주로 로고나 제목 등이 들어간다.

2) <nav>
다른 페이지나 영역으로 이동할 수 있는
내비게이션 링크를 모아 놓는 영역이다.

3) <main>
웹 페이지의 핵심 콘텐츠를 나타낸다.
일반적으로 페이지에서 한 번 사용한다.

4) <section>
주제별로 콘텐츠를 구분하는 영역이다.

5) <article>
독립적으로 배포하거나 재사용할 수 있는 콘텐츠를 나타낸다.
예를 들어 게시글이나 뉴스 기사가 있다.

6) <aside>
본문과 간접적으로 관련된 내용을 나타낸다.
주로 사이드바나 관련 링크 등에 사용한다.

7) <footer>
웹 페이지나 특정 영역의 바닥글을 나타낸다.
주로 저작권이나 연락처 등이 들어간다.


    사용 방법

1. 기본 시맨틱 태그 사용하기

<header>
    <h1>나의 웹사이트</h1>
</header>

<nav>
    <a href="#">홈</a>
    <a href="#">소개</a>
    <a href="#">게시판</a>
</nav>

<main>
    <section>
        <h2>웹 개발 공부</h2>
        <p>HTML과 CSS를 공부하고 있습니다.</p>
    </section>
</main>

<footer>
    <p>Copyright 2026 My Website</p>
</footer>

코드 설명

- header로 웹 페이지의 머리말을 만든다.
- nav로 페이지 이동 링크를 구성한다.
- main으로 핵심 콘텐츠를 구분한다.
- section으로 주제별 내용을 나눈다.
- footer로 웹 페이지의 바닥글을 만든다.


2. article과 aside 사용하기

<main>
    <article>
        <h2>HTML 공부 기록</h2>
        <p>오늘은 시맨틱 태그에 대해 배웠다.</p>
    </article>

    <aside>
        <h3>관련 학습</h3>
        <p>CSS 기본 문법</p>
    </aside>
</main>

코드 설명

- article은 독립적으로 사용할 수 있는 게시글 영역이다.
- aside는 본문과 관련된 추가 정보를 표시한다.
- 각각의 역할에 맞게 콘텐츠를 구분할 수 있다.


3. 시맨틱 태그를 활용한 웹 페이지

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>나의 학습 페이지</title>
</head>
<body>

    <header>
        <h1>개발 공부 기록</h1>
        <p>나의 웹 개발 학습 공간</p>
    </header>

    <nav>
        <a href="#html">HTML</a>
        <a href="#css">CSS</a>
        <a href="#js">JavaScript</a>
    </nav>

    <main>
        <section id="html">
            <h2>HTML 학습</h2>
            <article>
                <h3>HTML 기본 구조</h3>
                <p>HTML 문서의 기본 구성 요소를 배웠다.</p>
            </article>
        </section>

        <section id="css">
            <h2>CSS 학습</h2>
            <p>웹 페이지의 디자인을 담당하는 언어이다.</p>
        </section>

        <section id="js">
            <h2>JavaScript 학습</h2>
            <p>웹 페이지에 동적인 기능을 추가한다.</p>
        </section>
    </main>

    <footer>
        <p>나의 개발 학습 기록</p>
    </footer>

</body>
</html>

코드 설명

- header에 웹사이트 제목과 설명을 작성한다.
- nav에 각 학습 영역으로 이동하는 링크를 만든다.
- main 안에 핵심 학습 내용을 배치한다.
- section으로 HTML, CSS, JavaScript 영역을 구분한다.
- article에 독립적인 학습 게시글을 작성한다.
- footer에 페이지의 마무리 내용을 작성한다.


    코드 분석

시맨틱 태그는 단순히 영역을 나누는 것뿐만 아니라
각 영역의 의미와 역할을 명확하게 표현하는 기능을 한다.

기존에는 div를 사용하여 모든 영역을 구분할 수 있었지만,
시맨틱 태그를 사용하면 코드만 보고도 해당 영역의 목적을
쉽게 파악할 수 있다.

또한 검색 엔진이나 보조 기술이 웹 페이지의 구조와
콘텐츠를 이해하는 데 도움을 줄 수 있다.

시맨틱 태그는 디자인을 자동으로 변경하는 기능은 아니며,
CSS를 함께 사용하면 원하는 형태로 꾸밀 수 있다.


    복습하면서 알게 된 점

이번 학습을 통해 HTML에는 단순히 영역을 나누는 태그뿐만 아니라
각 영역의 역할을 의미적으로 표현하는 시맨틱 태그가 있다는 것을 알게 되었다.

특히 header, nav, main, section, footer의 역할을 이해하면서
웹 페이지를 더 체계적으로 구성할 수 있다는 점을 배웠다.

앞으로 웹 페이지를 제작할 때 div만 사용하는 것이 아니라
각 영역의 목적에 맞는 시맨틱 태그를 활용해야겠다.


📌 AI 활용 복습 문제

1) 시맨틱 태그란 무엇인가?

정답: 태그 자체에 의미가 담겨 있어 웹 페이지의 영역과
콘텐츠의 역할을 명확하게 나타내는 HTML 태그이다.

2) 웹 페이지의 핵심 콘텐츠를 나타내는 태그는 무엇인가?

정답: <main> 태그이다.

3) 페이지 이동 링크를 모아 놓는 태그는 무엇인가?

정답: <nav> 태그이다.

4) 독립적으로 배포하거나 재사용할 수 있는 콘텐츠를
나타내는 태그는 무엇인가?

정답: <article> 태그이다.

5) 시맨틱 태그를 사용하면 어떤 장점이 있는가?

정답: 코드의 구조와 의미를 쉽게 파악할 수 있으며,
검색 엔진과 보조 기술이 콘텐츠를 이해하는 데 도움을 준다.
